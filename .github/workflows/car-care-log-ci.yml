name: Car Care Log CI

on:
  pull_request:
    paths:
      - "car-care-log/**"
      - ".github/workflows/car-care-log-ci.yml"
  push:
    paths:
      - "car-care-log/**"
      - ".github/workflows/car-care-log-ci.yml"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: car-care-log

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect embedded Car Care Log
        id: car_app
        shell: bash
        working-directory: .
        run: |
          if [[ -f car-care-log/package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm standalone extraction
        if: steps.car_app.outputs.present != 'true'
        shell: bash
        working-directory: .
        run: echo "Car Care Log CI now runs in rawp123/car-care-log."

      - name: Set up Node
        if: steps.car_app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: car-care-log/package-lock.json

      - name: Install dependencies
        if: steps.car_app.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.car_app.outputs.present == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.car_app.outputs.present == 'true'
        run: npm run typecheck

      - name: Verify runtime assets
        if: steps.car_app.outputs.present == 'true'
        run: npm run verify:runtime-assets

      - name: Fresh-user smoke
        if: steps.car_app.outputs.present == 'true'
        run: npm run smoke:fresh-user

      - name: Test
        if: steps.car_app.outputs.present == 'true'
        run: npm test
