<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Current availability information for Car Care Log.">
  <link rel="canonical" href="https://robertparrish.dev/car-care-log/website/">
  <title>Car Care Log</title>
  <style>
    :root{color-scheme:light;--bg:#f6f4ef;--surface:#fff;--text:#171714;--muted:#5d5a52;--border:#ded8ce;--accent:#31524d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
    main{width:min(640px,100%);padding:36px;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:0 18px 44px rgba(45,39,29,.08)}
    .eyebrow{margin:0 0 10px;color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2rem,7vw,3.4rem);line-height:1.04}
    p{margin:16px 0 0;color:var(--muted);line-height:1.65}
    nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 17px;border:1px solid var(--border);border-radius:10px;color:var(--text);font-weight:800;text-decoration:none}
    a:first-child{border-color:var(--accent);color:#fff;background:var(--accent)}
    a:focus-visible{outline:3px solid rgba(49,82,77,.28);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Standalone workspace</p>
    <h1>Car Care Log</h1>
    <p>Car Care Log is now maintained in its own private repository with dedicated macOS, Windows, and Linux validation. A public download is not currently available.</p>
    <nav aria-label="Car Care Log links">
      <a href="/">Back to products</a>
      <a href="/contact/">Contact</a>
    </nav>
  </main>
</body>
</html>
